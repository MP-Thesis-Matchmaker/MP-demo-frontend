<ng-container *transloco="let t">
  <h2 mat-dialog-title>{{ t(data.titleKey, data.params) }}</h2>
  <mat-dialog-content>
    <p class="m-0">{{ t(data.bodyKey, data.params) }}</p>
    @if (data.warningKey) {
      <p class="warning-banner mt-3 mb-0">{{ t(data.warningKey, data.params) }}</p>
    }
    <!-- The focus trap takes the first cdkFocusInitial in the DOM, so with a phrase the input gets it. -->
    @if (data.phrase; as phrase) {
      <p class="confirm-dialog__phrase mt-3 mb-2">
        {{ t('components.confirm-dialog.phrase-label') }} <code>{{ phrase }}</code>
      </p>
      <mat-form-field appearance="outline" class="w-100" subscriptSizing="dynamic">
        <input
          matInput
          class="confirm-dialog__input"
          autocomplete="off"
          spellcheck="false"
          cdkFocusInitial
          [attr.aria-label]="t('components.confirm-dialog.phrase-label') + ' ' + phrase"
          [value]="typed$$()"
          (input)="typed$$.set($any($event.target).value)"
          (keydown.enter)="confirmTyped($event)">
      </mat-form-field>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="false">{{ t('components.confirm-dialog.cancel') }}</button>
    <button
      mat-flat-button
      type="button"
      class="confirm-dialog__confirm"
      [class.confirm-dialog__confirm--danger]="data.danger"
      [disabled]="!matches$$()"
      [mat-dialog-close]="true"
      cdkFocusInitial>{{ t(data.confirmKey, data.params) }}</button>
  </mat-dialog-actions>
</ng-container>
